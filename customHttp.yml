customHeaders:
  - pattern: '**'
    headers:
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://www.google.com; font-src 'self' data:; connect-src 'self' https://api.hitnscore.com wss://*.execute-api.eu-west-2.amazonaws.com https://*.google-analytics.com https://www.googletagmanager.com; frame-src https://www.google.com; upgrade-insecure-requests"
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=()'
      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin'
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-store'
  - pattern: '/login*'
    headers:
      - key: 'Cache-Control'
        value: 'no-store'
  - pattern: '/rckscoreAdmin*'
    headers:
      - key: 'Cache-Control'
        value: 'no-store'
