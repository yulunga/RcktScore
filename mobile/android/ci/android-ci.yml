# GitHub Actions workflow for the Android app.
#
# This file lives here because Android work is limited to mobile/android/.
# To enable it, a repository owner copies it to .github/workflows/android-ci.yml.
name: Android CI

on:
  pull_request:
    paths: ["mobile/android/**"]
  push:
    branches: [main]
    paths: ["mobile/android/**"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile/android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests and debug build
        run: >
          ./gradlew --stacktrace
          lintDevDebug
          testDevDebugUnitTest
          assembleDevDebug
          -PHITNSCORE_VERSION_CODE=${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hitnscore-dev-debug
          path: mobile/android/app/build/outputs/apk/dev/debug/*.apk

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/

